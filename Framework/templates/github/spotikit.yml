name: SpotiKit

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  spotikit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; elif [ -f package.json ]; then npm install; fi
      - name: Build
        run: npx --yes spotikit-kit build
      - name: Check
        run: npx --yes spotikit-kit check
      - name: Commit the build
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Build for SpotiKit"
            git push
          fi
      - name: Pack
        if: startsWith(github.ref, 'refs/tags/v')
        run: npx --yes spotikit-kit pack --out release
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.zip --generate-notes
